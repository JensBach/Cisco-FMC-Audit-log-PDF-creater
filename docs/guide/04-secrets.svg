<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" font-family="Menlo, Consolas, monospace" font-size="13">
<rect width="760" height="286" rx="10" fill="#1E1E2E"/>
<rect width="760" height="32" rx="10" fill="#313244"/><rect y="22" width="760" height="10" fill="#313244"/>
<circle cx="18" cy="16" r="6" fill="#F38BA8"/><circle cx="38" cy="16" r="6" fill="#F9E2AF"/><circle cx="58" cy="16" r="6" fill="#A6E3A1"/>
<text x="380.0" y="21" fill="#CDD6F4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12">Terminal – gem FMC-login i user-secrets</text>
<text x="16" y="56" xml:space="preserve"><tspan fill="#89B4FA">$ </tspan><tspan fill="#CDD6F4">dotnet user-secrets set &quot;Fmc:Host&quot; &quot;10.0.0.10&quot;</tspan></text>
<text x="16" y="76" fill="#A6E3A1" xml:space="preserve">Successfully saved Fmc:Host to the secret store.</text>
<text x="16" y="96" xml:space="preserve"><tspan fill="#89B4FA">$ </tspan><tspan fill="#CDD6F4">dotnet user-secrets set &quot;Fmc:Username&quot; &quot;api-user&quot;</tspan></text>
<text x="16" y="116" fill="#A6E3A1" xml:space="preserve">Successfully saved Fmc:Username to the secret store.</text>
<text x="16" y="136" xml:space="preserve"><tspan fill="#89B4FA">$ </tspan><tspan fill="#CDD6F4">dotnet user-secrets set &quot;Fmc:Password&quot; &quot;MitHemmeligeKodeord&quot;</tspan></text>
<text x="16" y="156" fill="#A6E3A1" xml:space="preserve">Successfully saved Fmc:Password to the secret store.</text>
<text x="16" y="176" fill="#A6ADC8" xml:space="preserve"></text>
<text x="16" y="196" xml:space="preserve"><tspan fill="#89B4FA">$ </tspan><tspan fill="#CDD6F4">dotnet user-secrets list</tspan></text>
<text x="16" y="216" fill="#A6ADC8" xml:space="preserve">Fmc:Username = api-user</text>
<text x="16" y="236" fill="#A6ADC8" xml:space="preserve">Fmc:Password = MitHemmeligeKodeord</text>
<text x="16" y="256" fill="#A6ADC8" xml:space="preserve">Fmc:Host = 10.0.0.10</text>
</svg>